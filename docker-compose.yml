services:
  db:
    image: pgvector/pgvector:pg16
    hostname: db
    environment:
      POSTGRES_USER: asktherepo
      POSTGRES_PASSWORD: asktherepo
      POSTGRES_DB: ask-the-repo
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asktherepo -d ask-the-repo"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks:
      - askrepo

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://asktherepo:asktherepo@db:5432/ask-the-repo
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - askrepo

networks:
  askrepo:
    driver: bridge

volumes:
  pgdata:
